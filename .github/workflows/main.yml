name: Build Speed Xz

# Taruh SpeedXz.zip di root repo, commit, selesai.
# Setiap kali ZIP diganti (update), APK baru otomatis dibuat dan dirilis.
on:
  push:
    branches: [main, master]
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-speedxz
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek
        run: |
          set -eu
          ZIP=$(ls -t ./*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::Tidak ada file .zip di root repo. Upload SpeedXz.zip dulu."
            exit 1
          fi
          echo "Memakai: $ZIP"
          rm -rf _src
          mkdir _src
          unzip -q "$ZIP" -d _src
          SETTINGS=$(find _src -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts tidak ketemu di dalam ZIP."
            exit 1
          fi
          DIR=$(cd "$(dirname "$SETTINGS")" && pwd)
          echo "Folder proyek: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Simpan laporan build jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedXz-build-report
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports
            ${{ env.PROJECT_DIR }}/build/reports
          if-no-files-found: ignore

      - name: Kumpulkan APK
        run: |
          set -eu
          APK=$(find "$PROJECT_DIR" -path "*outputs/apk/release/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK tidak ketemu setelah build."
            exit 1
          fi
          mkdir -p out
          cp "$APK" "out/SpeedXz-v${{ github.run_number }}.apk"
          echo "APK_FILE=out/SpeedXz-v${{ github.run_number }}.apk" >> "$GITHUB_ENV"
          ls -la out

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedXz-APK
          path: out/*.apk

      - name: Buat rilis (APK siap diunduh dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          NOTES="Speed Xz x Imran Peratama, build ${{ github.run_number }}. Pasang APK ini menimpa versi lama (tanda tangan sama, tidak perlu uninstall)."
          gh release create "$TAG" "$APK_FILE" --title "Speed Xz $TAG" --notes "$NOTES" --target "${{ github.sha }}" \
            || gh release upload "$TAG" "$APK_FILE" --clobber
